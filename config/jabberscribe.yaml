# JabberScribe configuration. Secrets come from environment variables, never here.
paths:
  drop_root: D:/jabberscribe/drop
  work_dir: D:/jabberscribe/work
  audio_store: D:/jabberscribe/audio
  db_path: D:/jabberscribe/jabberscribe.db

watcher:
  poll_seconds: 30
  min_age_seconds: 15

# Activation switch. Stages run in this order; each one is checkpointed, so a
# crash resumes at the first incomplete stage rather than starting over.
#
# Implemented today: audio, stt
# Landing with Plan 2:  enrich, render, publish, notify
#
# Add a stage name here once it exists to turn it on. `jabberscribe doctor`
# reports any stage that is enabled but not yet implemented, so activating one
# early tells you at startup instead of failing partway through a call.
pipeline:
  stages: [audio, stt]
  # stages: [audio, stt, render, publish]          # + Confluence page
  # stages: [audio, stt, render, publish, notify]  # + participant email
  # stages: [audio, stt, enrich, render, publish, notify]  # + Hebrew summary

# Required once 'publish' is in pipeline.stages -- config load refuses otherwise.
# The PAT comes from JABBERSCRIBE_CONFLUENCE_PAT, never from this file.
# confluence:
#   base_url: https://wiki.corp.local
#   space_key: CALLS
#   parent_page_id: "123456"
#   compliance_group: callrec-compliance
#   attach_audio: false

# Required once 'notify' is in pipeline.stages.
# Credentials come from JABBERSCRIBE_SMTP_USER / JABBERSCRIBE_SMTP_PASSWORD.
# mail:
#   smtp_host: smtp.corp.local
#   smtp_port: 25
#   use_tls: false
#   from_address: jabberscribe@corp.local
#   compliance_bcc: callrec-archive@corp.local
#   ops_alert_to: it-ops@corp.local
#   fallback_to: it-ops@corp.local

retention:
  audio_days: 90
  page_days: 365

stt:
  model: ivrit-ai/whisper-large-v3-turbo-ct2
  compute_type: int8
  device: auto
  vocabulary_file: config/custom_vocabulary.txt
